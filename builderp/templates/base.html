<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}BuildERP{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"><script src="{{ url_for('static',filename='app.js') }}" defer></script></head>
<body><header class="topbar"><a class="brand" href="/workspace"><span class="brandmark">B</span> BuildERP<span class="brandnote">PROJECT INTELLIGENCE</span></a><nav>{% if user %}<a href="/workspace">Workspace</a><a href="/settings">Settings</a><span class="username">{{ user.username }}</span><form action="/logout" method="post"><input type="hidden" name="_csrf" value="{{ csrf }}"><button class="textbutton">Sign out</button></form>{% endif %}</nav></header>
<main>{% for message in get_flashed_messages() %}<div class="notice" role="status">{{ message }}</div>{% endfor %}{% block body %}{% endblock %}</main><footer>BuildERP <span>Construction documents. Traceable decisions.</span></footer></body></html>
