<div class="processing panel"><div><strong>{{ 'Read and prepare' if document.doc_kind=='spec' else 'Drawing workflow' }}</strong><p class="small muted">Run each step in order. Saved progress resumes on retry.</p></div><div class="actions"><form method="post" action="/documents/{{ document.id }}/action" data-job="/api/documents/{{ document.id }}/prepare"><input type="hidden" name="_csrf" value="{{ csrf }}"><button name="action" value="prepare">1. Prepare document</button></form>{% if document.doc_kind=='spec' %}<form method="post" action="/documents/{{ document.id }}/action" data-job="/api/documents/{{ document.id }}/generate"><input type="hidden" name="_csrf" value="{{ csrf }}"><button name="action" value="generate" class="primary">2. Generate submittal log</button></form>{% else %}<a class="button primary" href="?tab=crops">Detect &amp; review tables</a>{% endif %}<form method="post" action="/documents/{{ document.id }}/action" data-job="/api/documents/{{ document.id }}/index"><input type="hidden" name="_csrf" value="{{ csrf }}"><button name="action" value="index">{{ '3' if document.doc_kind=='spec' else '2' }}. Prepare chat</button></form></div><div class="job-status small" role="status" aria-live="polite"></div></div>
