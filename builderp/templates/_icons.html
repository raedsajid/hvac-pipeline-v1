{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icon">
{% if name=='folder' %}<path d="M3 7V5h6l2 2h10v13H3Z"/>
{% elif name=='building' %}<path d="M4 21V5l8-3v19M12 8h8v13M2 21h20M7 7v2m0 3v2m0 3v1m9-7v2m0 3v2"/>
{% elif name=='file' %}<path d="M14 2H5v20h14V7Z M14 2v6h5M8 12h8m-8 4h8"/>
{% elif name=='check' %}<path d="m3 12 4 4L17 6m-5 10 3 3L22 12"/>
{% elif name=='grid' %}<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18M3 15h18"/>
{% elif name=='source' %}<path d="M2 4h8l2 2 2-2h8v16h-8l-2 2-2-2H2Zm10 2v16"/>
{% elif name=='chat' %}<path d="M21 3H3v15h5l4 4v-4h9ZM7 8h10M7 12h6"/>
{% elif name=='clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>
{% elif name=='settings' %}<path d="m9 3-1 3-3 1-2 4 2 2v4l4 3 3-1 3 1 4-3v-4l2-2-2-4-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/>
{% elif name=='panel' %}<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>
{% elif name=='arrow' %}<path d="M5 12h14m-5-5 5 5-5 5"/>
{% elif name=='arrow-up' %}<path d="M7 17 17 7M7 7h10v10"/>
{% elif name=='chevron' %}<path d="m7 10 5 5 5-5"/>
{% elif name=='plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name=='upload' %}<path d="M12 16V3m-5 5 5-5 5 5M3 16v5h18v-5"/>
{% elif name=='close' %}<path d="m6 6 12 12M6 18 18 6"/>
{% endif %}</svg>
{%- endmacro %}
{% macro brand() -%}<span class="brand"><svg width="29" height="31" viewBox="0 0 29 31" aria-hidden="true"><path d="M3 27V4h12l10 9v14H3Z M10 27V13h15M10 19h15M15 4v9" fill="none" stroke="currentColor" stroke-width="3"/></svg><span>Build<span class="brand-light">ERP</span></span></span>{%- endmacro %}
