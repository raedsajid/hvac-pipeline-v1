<dialog id="upload-document" class="upload-dialog" aria-labelledby="upload-title">
  <div class="dialog-heading">
    <h2 id="upload-title">Upload PDFs</h2>
    <button type="button" class="icon-button" data-close-dialog aria-label="Close">{{ icon('close') }}</button>
  </div>
  <p class="muted dialog-subtitle">Add source documents to {{ project.name }}.</p>
  <form action="/projects/{{ project.id }}/upload" method="post" enctype="multipart/form-data" {% if direct_upload %}data-upload-project="{{ project.id }}"{% endif %} data-upload-return="/projects/{{ project.id }}?tab={{ 'drawings' if project_tab in ['drawings','equipment'] else 'specs' }}">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <label class="upload-field">Document type
      <select name="docKind">
        <option value="spec">Specification</option>
        <option value="drawing" {{ 'selected' if project_tab in ['drawings','equipment'] }}>Drawing</option>
      </select>
    </label>
    <label class="upload-zone">
      {{ icon('upload',28) }}
      <span class="upload-zone-title">Choose PDFs</span>
      <input type="file" name="file" accept="application/pdf,.pdf" multiple required>
      <span class="small muted">Up to 10 MB · 200 pages each · Multiple PDFs allowed</span>
    </label>
    <button class="primary orange full upload-submit" type="submit">Upload PDFs {{ icon('upload',18) }}</button>
    <p class="upload-status small" role="status" aria-live="polite"></p>
    {% if cloud_deployment %}<noscript>JavaScript is required for direct uploads over 4 MB on Vercel.</noscript>{% endif %}
  </form>
</dialog>
