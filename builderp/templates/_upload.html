<dialog id="upload-document" aria-labelledby="upload-title"><div class="dialog-heading"><h2 id="upload-title">Upload PDFs</h2><button type="button" class="icon-button" data-close-dialog aria-label="Close">{{ icon('close') }}</button></div><p class="muted">Add source documents to {{ project.name }}.</p><form action="/projects/{{ project.id }}/upload" method="post" enctype="multipart/form-data" {% if direct_upload %}data-upload-project="{{ project.id }}"{% endif %}><input type="hidden" name="_csrf" value="{{ csrf }}"><label>Document type<select name="docKind"><option value="spec">Specification</option><option value="drawing" {{ 'selected' if project_tab in ['drawings','equipment'] }}>Drawing</option></select></label><label class="upload-zone">{{ icon('upload',28) }}<span>Choose a PDF</span><input type="file" name="file" accept="application/pdf,.pdf" required><span class="small muted">Up to 10 MB · 200 pages · One PDF per upload</span></label><button class="primary orange full">Upload PDF {{ icon('upload',18) }}</button><p class="upload-status small" role="status" aria-live="polite"></p>{% if cloud_deployment %}<noscript>JavaScript is required for direct uploads over 4 MB on Vercel.</noscript>{% endif %}</form></dialog>
